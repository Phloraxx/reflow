[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reflow-finance"
version = "0.1.0"
description = "Evidence-first financial truth compiler for payment settlement reconciliation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112,<7",
  "mypy>=1.11,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
web = [
  "fastapi>=0.141,<0.142",
  "httpx2>=2.12,<3",
  "uvicorn>=0.35,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["reflow"]
