# Copy to /etc/cloudflared/config.yml and replace placeholders.
tunnel: <TUNNEL-UUID>
credentials-file: /etc/cloudflared/<TUNNEL-UUID>.json

ingress:
  # Keep this hostname behind Cloudflare Access for human operators.
  - hostname: control.example.com
    service: http://127.0.0.1:8080

  # Do not put human Access in front of the provider callback hostname.
  # ReFlow authenticates Razorpay using the exact raw-body HMAC signature.
  - hostname: webhooks.example.com
    service: http://127.0.0.1:8081

  - service: http_status:404
