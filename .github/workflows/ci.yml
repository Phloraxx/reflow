name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reflow_test
          POSTGRES_PASSWORD: reflow_test
          POSTGRES_DB: reflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reflow_test -d reflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,postgres]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Tests
        env:
          REFLOW_TEST_POSTGRES_DSN: postgresql://reflow_test:reflow_test@127.0.0.1:5432/reflow_ci
        run: python -m pytest
